<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PLEXUSOLAR - Presupuesto FV</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
    max-width: 700px;
    margin: auto;
    background: #f4f6f8;
  }

  #instalarBtn { display:none; }

  .app-header {
    display:flex;
    align-items:center;
    gap:15px;
    padding:12px;
    background:#0a0a0a;
    color:white;
    border-radius:10px;
  }

  .form-section {
    background:#fff;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
  }

  label { display:block; margin-top:10px; font-weight:bold; }

  input, select {
    width:100%;
    padding:8px;
    margin-top:4px;
  }

  button {
    margin-top:15px;
    padding:10px;
    background:#0a0a0a;
    color:white;
    border:none;
  }

  .resultado-print {
    display:none;
  }

  /* ===== IMPRESIÓN ===== */
  @media print {

    body * {
      visibility: hidden;
    }

    .resultado-print, .resultado-print * {
      visibility: visible;
    }

    .resultado-print {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
    }

    .print-header {
      border-bottom: 2px solid black;
      margin-bottom: 20px;
      padding-bottom: 10px;
    }

    .print-section {
      margin-bottom: 15px;
    }

    .print-title {
      font-weight: bold;
      margin-bottom: 5px;
    }
  }
</style>
</head>

<body>

<div class="app-header">
  <div>
    <div style="font-size:20px; font-weight:bold;">PLEXUSOLAR</div>
    <div style="font-size:12px;">Leonardo Bonel</div>
    <div style="font-size:11px;">CUIT: 23-28851599-9</div>
  </div>
</div>

<div class="form-section">

<label>Fecha:</label>
<span id="fecha"></span>

<label>Cotización USD</label> 
<input type="number" id="usd" value="1000" />

<label>N° Presupuesto</label> 
<input id="numero" readonly />

<label>Punto de Venta</label>
<select id="puntoVenta" onchange="generarNumero()">
  <option value="CG">Casagrande</option>
  <option value="LF">La Falda</option>
  <option value="VA">Villa Allende</option>
  <option value="RC">Río Cuarto</option>
</select>

<label>Cliente</label> 
<input id="cliente" />

<label>Ubicación</label> 
<input id="ubicacion" />

</div>

<div class="form-section">

<h3>Datos del sistema</h3>

<label>Potencia inversor (W)</label> 
<input type="number" id="invW" value="5000" />

<label>Cantidad de paneles</label>
<input type="number" id="cantPaneles" value="10" oninput="calcPaneles()" />

<label>Potencia por panel (W)</label> 
<input type="number" id="potPanel" value="550" oninput="calcPaneles()" />

<label>Potencia paneles (W)</label> 
<input id="panelW" readonly />

<label>Complejidad</label> 
<select id="complejidad">
  <option value="simple">Simple</option>
  <option value="compleja">Compleja</option>
</select>

</div>

<button onclick="calcular()">Calcular</button>
<button onclick="imprimir()">Exportar PDF</button>

<div id="resultado"></div>

<!-- ===== PLANTILLA PDF ===== -->
<div class="resultado-print" id="printArea"></div>

<script>

// Numeración
function generarNumero(){
  let pv = puntoVenta.value;
  let key = "contador_" + pv;
  let contador = localStorage.getItem(key) || 0;
  contador++;
  localStorage.setItem(key, contador);
  numero.value = pv + "-" + String(contador).padStart(3,"0");
}

// Paneles
function calcPaneles(){
  panelW.value = cantPaneles.value * potPanel.value;
}

// Cálculo
function calcular(){

  let powerW = Math.min(invW.value, panelW.value);
  let kWp = powerW / 1000;
  let usdW = kWp <= 10 ? (complejidad.value === "simple" ? 0.10 : 0.15) : 0.15;

  let labor = powerW * usdW;

  resultado.innerHTML = `<b>Mano de obra:</b> USD ${labor.toFixed(1)}`;

  // ===== ARMADO PDF =====
  printArea.innerHTML = `
    <div class="print-header">
      <h2>PLEXUSOLAR</h2>
      <div>CUIT: 23-28851599-9</div>
    </div>

    <div class="print-section">
      <div><b>Presupuesto:</b> ${numero.value}</div>
      <div><b>Punto de venta:</b> ${puntoVenta.options[puntoVenta.selectedIndex].text}</div>
      <div><b>Fecha:</b> ${fecha.innerText}</div>
    </div>

    <div class="print-section">
      <div class="print-title">Datos del cliente</div>
      <div><b>Cliente:</b> ${cliente.value}</div>
      <div><b>Ubicación:</b> ${ubicacion.value}</div>
    </div>

    <div class="print-section">
      <div class="print-title">Resultado</div>
      <div><b>Potencia considerada:</b> ${powerW} W</div>
      <div><b>Mano de obra:</b> USD ${labor.toFixed(1)}</div>
    </div>

    <br>
    <i>El presente reviste carácter de PRESUPUESTO.</i>
  `;
}

// imprimir
function imprimir(){
  window.print();
}

fecha.innerText = new Date().toLocaleDateString();
generarNumero();
calcPaneles();

</script>

</body>
</html>
