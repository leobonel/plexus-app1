<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PLEXUSOLAR - Presupuesto FV</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="icon-192.png">

<style>
body {
  font-family: Arial, sans-serif;
  padding: 20px;
  max-width: 700px;
  margin: auto;
  background: #f4f6f8;
}

#instalarBtn {
  display:none;
  width:100%;
  padding:10px;
  margin-bottom:15px;
  border-radius:8px;
  background:#28a745;
  color:white;
  border:none;
  font-weight:bold;
}

.form-section {
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

label { display:block; margin-top:10px; font-weight:bold; }

input, select {
  width:100%;
  padding:8px;
}

button {
  margin-top:10px;
  padding:10px;
  border:none;
  background:#0a0a0a;
  color:white;
  border-radius:5px;
}

.warn { color:red; font-weight:bold; }

.resultado-print { display:none; }

@media print {
  body * { visibility:hidden; }

  .resultado-print, .resultado-print * {
    visibility:visible;
  }

  .resultado-print {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    padding:30px;
  }
}
</style>
</head>

<body>

<button id="instalarBtn">Instalar App</button>

<div class="form-section">

<label>Fecha:</label>
<span id="fecha"></span>

<label>Cotización USD</label> 
<input type="number" id="usd" value="1000">

<label>N° Presupuesto</label> 
<input id="numero" readonly>

<label>Punto de Venta</label>
<select id="puntoVenta" onchange="generarNumero()">
  <option value="CG">Casagrande</option>
  <option value="LF">La Falda</option>
  <option value="VA">Villa Allende</option>
  <option value="RC">Río Cuarto</option>
</select>

<label>Cliente</label> 
<input id="cliente">

<label>Ubicación</label> 
<input id="ubicacion">

</div>

<div class="form-section">

<h3>Datos del sistema</h3>

<label>Tipo</label>
<select id="tipo" onchange="handleTipo()">
  <option value="on">On-Grid</option>
  <option value="off">Off-Grid</option>
</select>

<label>Potencia inversor</label>
<input id="invW" value="5000">

<label>Cantidad paneles</label>
<input id="cantPaneles" value="10" oninput="calcPaneles()">

<label>Potencia panel</label>
<input id="potPanel" value="550" oninput="calcPaneles()">

<label>Total paneles</label>
<input id="panelW" readonly>

<label>Equipamiento</label>
<input id="equipos">

<label>USD/W manual</label>
<select id="manual" onchange="toggleManual()">
  <option value="no">No</option>
  <option value="si">Sí</option>
</select>

<input id="usdW" value="0.2" disabled>

</div>

<div class="form-section">

<label>KM</label>
<input id="km" value="10">

<button onclick="calcular()">Calcular</button>

</div>

<div id="resultado"></div>

<button onclick="imprimir()">PDF</button>

<div id="printArea" class="resultado-print"></div>

<script>

// init
fecha.innerText = new Date().toLocaleDateString();

// numero
function generarNumero(){
 let pv=puntoVenta.value;
 let n=localStorage.getItem(pv)||0;
 n++;
 localStorage.setItem(pv,n);
 numero.value=pv+"-"+n;
}

// paneles
function calcPaneles(){
 panelW.value = Number(cantPaneles.value||0)*Number(potPanel.value||0);
}

// tipo
function handleTipo(){
 if(tipo.value==="on"){
  equipos.disabled=true;
  manual.disabled=false;
 }else{
  equipos.disabled=false;
  manual.value="no";
  manual.disabled=true;
  usdW.disabled=true;
 }
}

// manual
function toggleManual(){
 usdW.disabled = manual.value!=="si";
}

// calcular
function calcular(){

 let inv = Number(invW.value||0);
 let pan = Number(panelW.value||0);
 let usdVal = Number(usd.value||1);
 let kmVal = Number(km.value||0);

 let power = Math.min(inv, pan);

 let labor = tipo.value==="on"
   ? power*(manual.value==="si"?Number(usdW.value):0.1)
   : (Number(equipos.value||0)/usdVal)*0.16;

 let viaticos = kmVal*2*243;

 let warn = pan < inv
   ? "<div class='warn'>⚠️ Sistema subdimensionado en paneles respecto al inversor</div>"
   : "";

 resultado.innerHTML = `
 ${warn}
 Mano de obra: USD ${labor.toFixed(1)}<br>
 Viáticos: ARS ${viaticos}<br>
 Total: USD ${(labor+(viaticos/usdVal)).toFixed(1)}<br><br>
 <i>El presente reviste carácter de PRESUPUESTO.</i>
 `;
}

// PDF (CORREGIDO)
function imprimir(){

 if(!resultado.innerHTML){
  alert("Calculá primero");
  return;
 }

 printArea.innerHTML = `
 <h2>PLEXUSOLAR</h2>
 <b>Presupuesto:</b> ${numero.value}<br>
 <b>Fecha:</b> ${fecha.innerText}<br><br>

 <b>Cliente:</b> ${cliente.value}<br>
 <b>Ubicación:</b> ${ubicacion.value}<br><br>

 ${resultado.innerHTML}
 `;

 window.print();
}

// init
generarNumero();
calcPaneles();
handleTipo();

</script>

</body>
</html>
