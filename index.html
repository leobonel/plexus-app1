<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PLEXUSOLAR - Presupuesto FV</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
    max-width: 700px;
    margin: auto;
    background: #f4f6f8;
  }

  #instalarBtn {
    display: none;
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 8px;
    background:#28a745;
    color:white;
    border:none;
    cursor:pointer;
    font-weight:bold;
  }

  .app-header {
    display:flex;
    align-items:center;
    gap:15px;
    padding:12px 15px;
    background:#0a0a0a;
    color:white;
    border-radius:10px 10px 0 0;
    margin:-15px -15px 15px -15px;
  }

  .app-header img {
    width:50px;
    height:50px;
    border-radius:10px;
  }

  .form-section {
    background:#fff;
    padding:15px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    margin-bottom:20px;
  }

  label {
    display:block;
    margin-top:10px;
    font-weight:bold;
  }

  input, select {
    width:100%;
    padding:8px;
    margin-top:4px;
    border-radius:5px;
    border:1px solid #ccc;
  }

  button {
    padding:10px 15px;
    margin-top:10px;
    border:none;
    border-radius:5px;
    background:#0a0a0a;
    color:white;
    cursor:pointer;
  }

  .usdW-info {
    font-size:12px;
    color:#555;
    margin-left:10px;
  }

  .result {
    margin-top:20px;
    border-top:1px solid #ccc;
    padding-top:10px;
  }

  .warn {
    color:red;
    font-weight:bold;
  }
</style>
</head>

<body>

<button id="instalarBtn">Instalar App</button>

<div class="app-header">
  <img src="icon-192.png">
  <div>
    <div style="font-size:20px; font-weight:bold;">PLEXUSOLAR</div>
    <div style="font-size:12px;">Leonardo Bonel</div>
    <div style="font-size:11px;">CUIT: 23-28851599-9</div>
  </div>
</div>

<div class="form-section">
  <label>Fecha:</label>
  <span id="fecha"></span>

  <label>Cotización USD</label> 
  <input type="number" id="usd" value="1000" />

  <label>N° Presupuesto</label> 
  <input id="numero" readonly />

  <label>Punto de Venta</label>
  <select id="puntoVenta" onchange="generarNumero()">
    <option value="CG">Casagrande</option>
    <option value="LF">La Falda</option>
    <option value="VA">Villa Allende</option>
    <option value="RC">Río Cuarto</option>
  </select>

  <label>Cliente</label> 
  <input id="cliente" />

  <label>Ubicación</label> 
  <input id="ubicacion" />
</div>

<div class="form-section">
  <h3>Datos del sistema</h3>

  <label>Tipo de sistema</label> 
  <select id="tipo" onchange="handleTipo()">
    <option value="on">On-Grid</option>
    <option value="off">Off-Grid / Híbrido</option>
  </select>

  <label>¿Incluye baterías?</label> 
  <select id="bateria">
    <option value="no">No</option>
    <option value="si">Sí</option>
  </select>

  <label>¿Hay red eléctrica?</label> 
  <select id="red">
    <option value="si">Sí</option>
    <option value="no">No</option>
  </select>

  <label>Potencia inversor (W)</label> 
  <input type="number" id="invW" value="5000" />

  <h4>Cálculo de paneles</h4>

  <label>Cantidad de paneles</label>
  <input type="number" id="cantPaneles" value="10" oninput="calcPaneles()" />

  <label>Potencia por panel (W)</label> 
  <input type="number" id="potPanel" value="550" oninput="calcPaneles()" />

  <label>Potencia paneles a instalar (W)</label> 
  <input type="number" id="panelW" readonly />

  <label>Equipamiento (ARS)</label> 
  <input type="number" id="equipos" />

  <label>Complejidad</label> 
  <select id="complejidad">
    <option value="simple">Simple</option>
    <option value="compleja">Compleja</option>
  </select>

  <label>¿Usar USD/W manual?
    <span class="usdW-info">
      (Simple ≤10 kWp: 0.10 | Compleja ≤10 kWp: 0.15 | Simple >10 kWp: 0.15)
    </span>
  </label>

  <select id="manual" onchange="toggleManual()">
    <option value="no">No</option>
    <option value="si">Sí</option>
  </select>

  <label>Valor USD/W</label> 
  <input type="number" id="usdW" value="0.2" disabled />
</div>

<div class="form-section">
  <h3>Logística</h3>

  <label>Altura (m)</label> <input id="altura" />

  <label>Acceso complejo</label> 
  <select id="acceso">
    <option value="no">No</option>
    <option value="si">Sí</option>
  </select>

  <label>Distancia (km)</label> 
  <input type="number" id="km" value="10" />

  <label>Observaciones</label> 
  <input id="obs" />

  <button onclick="calcular()">Calcular</button>
</div>

<div class="result" id="resultado"></div>

<button onclick="window.print()">Exportar PDF</button>

<script>

// ===== NUMERACIÓN AUTOMÁTICA =====
function generarNumero(){
  let pv = document.getElementById("puntoVenta").value;

  let key = "contador_" + pv;
  let contador = localStorage.getItem(key) || 0;
  contador++;

  localStorage.setItem(key, contador);

  let numero = pv + "-" + String(contador).padStart(3, "0");
  document.getElementById("numero").value = numero;
}

// ===== INSTALACIÓN =====
let deferredPrompt;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById("instalarBtn");
  btn.style.display = "block";
  btn.onclick = () => deferredPrompt.prompt();
});

// ===== LÓGICA ORIGINAL =====
document.getElementById("fecha").innerText = new Date().toLocaleDateString();

function calcPaneles(){
  let cant = Number(cantPaneles.value);
  let pot = Number(potPanel.value);
  panelW.value = cant * pot;
}

function handleTipo(){
  let tipo = tipoSelect.value;
}

function toggleManual(){
  usdW.disabled = manual.value !== "si";
}

function getUSDW(powerW, complejidad){
  let kWp = powerW / 1000;
  if(kWp <= 10){
    return complejidad === "simple" ? 0.10 : 0.15;
  } else {
    return 0.15;
  }
}

function calcular(){
  let powerW = Math.min(invW.value, panelW.value);
  let labor = powerW * getUSDW(powerW, complejidad.value);

  resultado.innerHTML = `
    <b>Presupuesto:</b> ${numero.value} <br>
    <b>Mano de obra:</b> USD ${labor.toFixed(1)}
  `;
}

generarNumero();
calcPaneles();

</script>

</body>
</html>
