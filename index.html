<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PLEXUSOLAR - Presupuesto FV</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="icon-192.png">

<style>

* {
  box-sizing: border-box; /* 🔥 ARREGLA DESBORDES */
}

body {
  font-family: Arial, sans-serif;
  padding: 20px;
  max-width: 700px;
  margin: auto;
  background: #f4f6f8;
}

#instalarBtn {
  display:none;
  width:100%;
  padding:10px;
  margin-bottom:15px;
  border-radius:8px;
  background:#28a745;
  color:white;
  border:none;
  font-weight:bold;
}

.app-header {
  display:flex;
  gap:15px;
  padding:12px;
  background:#0a0a0a;
  color:white;
  border-radius:10px;
}

.form-section {
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

label { display:block; margin-top:10px; font-weight:bold; }

input, select {
  width:100%;
  padding:8px;
  margin-top:4px;
}

button {
  margin-top:10px;
  padding:10px;
  border:none;
  background:#0a0a0a;
  color:white;
  border-radius:5px;
}

.warn { color:red; font-weight:bold; }

.result { margin-top:20px; }

/* 🔥 PRINT CORREGIDO */
#printArea {
  display:none;
}

@media print {

  body * {
    display: none;
  }

  #printArea {
    display:block;
    padding:30px;
    font-size:14px;
  }

  #printArea * {
    display:block;
  }

  .print-header {
    border-bottom:2px solid black;
    margin-bottom:15px;
  }

}

</style>
</head>

<body>

<button id="instalarBtn">Instalar App</button>

<div class="app-header">
  <div>
    <div style="font-size:20px;"><b>PLEXUSOLAR</b></div>
    <div style="font-size:12px;">Leonardo Bonel</div>
    <div style="font-size:11px;">CUIT: 23-28851599-9</div>
  </div>
</div>

<div class="form-section">

<label>Fecha:</label>
<span id="fecha"></span>

<label>Cotización USD</label> 
<input type="number" id="usd" value="1000">

<label>N° Presupuesto</label> 
<input id="numero" readonly>

<label>Punto de Venta</label>
<select id="puntoVenta" onchange="generarNumero()">
  <option value="CG">Casagrande</option>
  <option value="LF">La Falda</option>
  <option value="VA">Villa Allende</option>
  <option value="RC">Río Cuarto</option>
</select>

<label>Cliente</label> 
<input id="cliente">

<label>Ubicación</label> 
<input id="ubicacion">

</div>

<div class="form-section">

<h3>Datos del sistema</h3>

<label>Tipo de sistema</label> 
<select id="tipo" onchange="handleTipo()">
  <option value="on">On-Grid</option>
  <option value="off">Off-Grid / Híbrido</option>
</select>

<label>¿Incluye baterías?</label> 
<select id="bateria">
  <option value="no">No</option>
  <option value="si">Sí</option>
</select>

<label>¿Hay red eléctrica?</label> 
<select id="red">
  <option value="si">Sí</option>
  <option value="no">No</option>
</select>

<label>Potencia inversor (W)</label> 
<input type="number" id="invW" value="5000">

<h4>Cálculo de paneles</h4>

<label>Cantidad de paneles</label>
<input type="number" id="cantPaneles" value="10" oninput="calcPaneles()">

<label>Potencia por panel (W)</label> 
<input type="number" id="potPanel" value="550" oninput="calcPaneles()">

<label>Potencia paneles (W)</label> 
<input id="panelW" readonly>

<label>Equipamiento (ARS)</label> 
<input type="number" id="equipos">

<label>Complejidad</label> 
<select id="complejidad">
  <option value="simple">Simple</option>
  <option value="compleja">Compleja</option>
</select>

<label>¿Usar USD/W manual?</label>
<select id="manual" onchange="toggleManual()">
  <option value="no">No</option>
  <option value="si">Sí</option>
</select>

<label>Valor USD/W</label> 
<input type="number" id="usdW" value="0.2" disabled>

</div>

<div class="form-section">

<h3>Logística</h3>

<label>Altura (m)</label>
<input id="altura">

<label>Acceso complejo</label>
<select id="acceso">
  <option value="no">No</option>
  <option value="si">Sí</option>
</select>

<label>Distancia (km)</label>
<input type="number" id="km" value="10">

<label>Observaciones</label>
<input id="obs">

<button onclick="calcular()">Calcular</button>

</div>

<div class="result" id="resultado"></div>

<button onclick="imprimir()">Exportar PDF</button>

<div id="printArea"></div>

<script>

// instalar
let deferredPrompt;
window.addEventListener("beforeinstallprompt",(e)=>{
 e.preventDefault();
 deferredPrompt=e;
 instalarBtn.style.display="block";
 instalarBtn.onclick=()=>deferredPrompt.prompt();
});

// numero
function generarNumero(){
 let pv=puntoVenta.value;
 let key="contador_"+pv;
 let n=localStorage.getItem(key)||0;
 n++;
 localStorage.setItem(key,n);
 numero.value=pv+"-"+String(n).padStart(3,"0");
}

// panel
function calcPaneles(){
 panelW.value = Number(cantPaneles.value||0) * Number(potPanel.value||0);
}

// tipo
function handleTipo(){
 if(tipo.value==="on"){
   equipos.disabled = true;
   bateria.disabled = true;
   red.disabled = true;
   manual.disabled = false;
   toggleManual();
 } else {
   equipos.disabled = false;
   bateria.disabled = false;
   red.disabled = false;
   manual.value = "no";
   manual.disabled = true;
   usdW.disabled = true;
 }
}

// manual
function toggleManual(){
 usdW.disabled = manual.value!=="si";
}

// USD/W
function getUSDW(powerW){
 if(manual.value==="si") return Number(usdW.value || 0);
 let kWp=powerW/1000;
 if(kWp<=10){
  return complejidad.value==="simple"?0.10:0.15;
 } else return 0.15;
}

// calcular
function calcular(){

 let inv = Number(invW.value||0);
 let pan = Number(panelW.value||0);
 let usdVal = Number(usd.value||1);
 let kmVal = Number(km.value||0);
 let equiposVal = Number(equipos.value||0);

 let powerW = Math.min(inv, pan);

 let labor = tipo.value==="on"
   ? powerW * getUSDW(powerW)
   : (equiposVal / usdVal) * 0.16;

 let viaticos = kmVal * 2 * 243;

 let totalUSD = labor + (viaticos / usdVal);
 let totalARS = totalUSD * usdVal;

 let warning = pan < inv
   ? "<div class='warn'>⚠️ Sistema subdimensionado en paneles respecto al inversor</div>"
   : "";

 resultado.innerHTML = `
 ${warning}
 <b>Mano de obra:</b> USD ${labor.toFixed(1)} <br>
 <b>Viáticos:</b> ARS ${viaticos.toFixed(0)} <br>
 <b>Total:</b> USD ${totalUSD.toFixed(1)} <br>
 <b>Total:</b> ARS ${totalARS.toFixed(0)} <br><br>
 <i>El presente reviste carácter de PRESUPUESTO.</i>
 `;
}

// imprimir
function imprimir(){

 if(!resultado.innerHTML){
   alert("Primero calculá el presupuesto");
   return;
 }

 printArea.innerHTML = `
 <div class="print-header">
   <h2>PLEXUSOLAR</h2>
   CUIT: 23-28851599-9
 </div>

 <b>Presupuesto:</b> ${numero.value}<br>
 <b>Fecha:</b> ${fecha.innerText}<br><br>

 <b>Cliente:</b> ${cliente.value}<br>
 <b>Ubicación:</b> ${ubicacion.value}<br><br>

 ${resultado.innerHTML}
 `;

 window.print();
}

// init
fecha.innerText=new Date().toLocaleDateString();
generarNumero();
calcPaneles();
handleTipo();

</script>

</body>
</html>
